const STATUSES = ["Not Started","In Progress","Submitted","Received","Approved","Closed","N/A"];
const SNAG_STATUSES = ["Not Started","Distributed","For distribution","Work In progress","Completed","Coordinated","To be uploaded"];
const STCLASS = {"Not Started":"st-ns","In Progress":"st-ip","Submitted":"st-sb","Received":"st-rc","Approved":"st-ap","N/A":"st-na",
  "Distributed":"st-sb","For distribution":"st-na","Work In progress":"st-ip","Completed":"st-ap","Coordinated":"st-vi","To be uploaded":"st-ns","Closed":"st-ap"};
const DONE = new Set(["Received","Approved","Completed","Coordinated","Closed"]);
const UNSTARTED = new Set(["Not Started","To be uploaded",""]);
const isSnag = (r)=> /^04/.test(r.main||"");
const statusesFor = (r)=> isSnag(r)?SNAG_STATUSES:STATUSES;
const ALL_STATUSES = STATUSES.concat(SNAG_STATUSES.filter(s=>!STATUSES.includes(s)));

// inject css
document.head.insertAdjacentHTML('beforeend','<style>'+CSS+'</style>');

let EXTRA_GROUPS = {};

let META={eyebrow:'fäm Interior · Handover Documentation',title:'Villa 606 — Document Master List',subtitle:'Operational handover-document tracker',footer:'Villa 606 Document Master List Tracker · fäm Interior · Client Handover Document Control'};
try{const el=document.getElementById('meta-state');if(el)META={...META,...JSON.parse(el.textContent)};}catch(e){}
let LAST_UNDO=null,undoTimer=null;
STATE.forEach(r=>{EXTRA_GROUPS[r.main]=EXTRA_GROUPS[r.main]||[];if(r.group&&!EXTRA_GROUPS[r.main].includes(r.group))EXTRA_GROUPS[r.main].push(r.group);});

// overlay local edits when running without the publish capability (preview / offline)
let ARTIFACT = null, capReady = false;
const LSKEY = 'v606_tracker_excel_20260901_review2';

const F = {q:"", folder:"All", group:"All", status:"All", resp:"All"};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shortFolder(m){return m;}
function stats(){
  const t=STATE.length; let done=0,na=0,init=0,ip=0,progressed=0;
  STATE.forEach(r=>{
    if(r.status==="N/A")na++;
    if(DONE.has(r.status))done++;
    if(r.status==="Not Started"||!r.status)init++;
    if(r.status==="In Progress"||r.status==="Work In progress")ip++;
    if(r.status!=="N/A"&&!UNSTARTED.has(r.status))progressed++;
  });
  const denom=t-na; const pct=denom>0?Math.round(done/denom*100):0;const progressPct=denom>0?Math.round(progressed/denom*100):0;
  return {t,done,na,init,ip,progressed,denom,pct,progressPct};
}
function folderStats(){
  const m={};
  STATE.forEach(r=>{const d=(m[r.main]=m[r.main]||{t:0,done:0,na:0,progressed:0});d.t++;if(r.status==="N/A")d.na++;else{if(DONE.has(r.status))d.done++;if(!UNSTARTED.has(r.status))d.progressed++;}});
  return m;
}
function distinctResp(){ return Array.from(new Set(STATE.map(r=>r.resp).filter(Boolean))).sort(); }
function groupsForFolder(){
  const rows=F.folder==='All'?STATE:STATE.filter(r=>r.main===F.folder);
  const stored=F.folder==='All'?Object.values(EXTRA_GROUPS).flat():EXTRA_GROUPS[F.folder]||[];
  return Array.from(new Set(rows.map(r=>r.group).filter(Boolean).concat(stored))).sort();
}
function subfoldersHTML(){
  if(F.folder==='All')return '';
  const groups=groupsForFolder();
  return `<div class="subfolderPanelHead"><h3>Subfolders in ${esc(F.folder)}</h3><button class="miniBtn" onclick="addSubfolderTo('${escAttr(F.folder)}')">＋ Add Subfolder</button></div>

}
function escAttr(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,' ')}
function mainFolderActions(main){return `<span class="groupHeadActions"><button class="miniBtn" onclick="addDocumentTo('${escAttr(main)}','')">＋ Add Document</button><button class="miniBtn" onclick="addSubfolderTo('${escAttr(main)}')">＋ Add Subfolder</button><button class="miniBtn" onclick="renameFolder('${escAttr(main)}')">Rename</button><button class="miniBtn danger" onclick="deleteFolder('${escAttr(main)}')">Delete</button></span>`}
function snapshotForUndo(label){LAST_UNDO={label,state:JSON.parse(JSON.stringify(STATE)),groups:JSON.parse(JSON.stringify(EXTRA_GROUPS)),meta:{...META}};clearTimeout(undoTimer)}
function showUndo(label){const b=document.getElementById('undoBar'),t=document.getElementById('undoText'),u=document.getElementById('undoBtn');if(!b||!t||!u)return;t.textContent=label;b.classList.add('show');u.onclick=undoLast;clearTimeout(undoTimer);undoTimer=setTimeout(()=>{b.classList.remove('show');LAST_UNDO=null},12000)}
function undoLast(){if(!LAST_UNDO)return;STATE=LAST_UNDO.state;EXTRA_GROUPS=LAST_UNDO.groups;META=LAST_UNDO.meta;LAST_UNDO=null;clearTimeout(undoTimer);persist();render();setSave('Deletion undone',false)}
function selectFolder(folder){F.folder=folder;F.group='All';F.status='All';render();setTimeout(()=>document.querySelector('.tablecard')?.scrollIntoView({behavior:'smooth',block:'start'}),50)}

function renameFolder(oldName){
  const next=prompt('Rename main folder:',oldName);if(!next||!next.trim()||next.trim()===oldName)return;
  STATE.forEach(r=>{if(r.main===oldName)r.main=next.trim()});
  if(EXTRA_GROUPS[oldName]){EXTRA_GROUPS[next.trim()]=EXTRA_GROUPS[oldName];delete EXTRA_GROUPS[oldName];}
  if(F.folder===oldName)F.folder=next.trim();persist();render();
}
function addMainFolder(){
  const name=prompt('Enter the new main folder name:');if(!name||!name.trim())return;
  const main=name.trim();if(!EXTRA_GROUPS[main])EXTRA_GROUPS[main]=[];F.folder=main;F.group='All';persist();render();
}
function addSubfolderTo(main){
  const name=prompt('Enter the new subfolder name:');if(!name||!name.trim())return;
  const group=name.trim();EXTRA_GROUPS[main]=EXTRA_GROUPS[main]||[];
  if(!EXTRA_GROUPS[main].includes(group))EXTRA_GROUPS[main].push(group);
  F.folder=main;F.group=group;persist();render();
}
function addNestedSubfolder(main,parentGroup){
  const name=prompt(`Enter a subfolder name inside "${parentGroup}":`);if(!name||!name.trim())return;
  const group=parentGroup+' / '+name.trim();EXTRA_GROUPS[main]=EXTRA_GROUPS[main]||[];
  if(!EXTRA_GROUPS[main].includes(group))EXTRA_GROUPS[main].push(group);
  F.folder=main;F.group=group;persist();render();
}
function addDocumentTo(main,group=''){
  const name=prompt(`Enter the document name for ${group?`"${group}"`:`"${main}"`}:`);if(!name||!name.trim())return;
  const it={id:newId(),main,group,title:name.trim(),status:(/^04/.test(main)?'To be uploaded':'Not Started'),resp:'',date:'',rem:''};
  STATE.push(it);if(group){EXTRA_GROUPS[main]=EXTRA_GROUPS[main]||[];if(!EXTRA_GROUPS[main].includes(group))EXTRA_GROUPS[main].push(group)}
  F.folder=main;F.group=group||'All';persist();render();
  setTimeout(()=>{const el=document.querySelector(`tr[data-id="${it.id}"] [data-f="title"]`);if(el){el.scrollIntoView({block:'center'});el.focus()}},40);
}
function deleteFolder(main){
  const count=STATE.filter(r=>r.main===main).length;
  if(!confirm(`Delete "${main}" and all ${count} document${count===1?'':'s'} inside it?`))return;
  snapshotForUndo(`Deleted folder “${main}”`);
  STATE=STATE.filter(r=>r.main!==main);delete EXTRA_GROUPS[main];F.folder='All';F.group='All';persist();render();
}
function renameSubfolder(main,oldGroup){
  const next=prompt('Rename subfolder:',oldGroup);if(!next||!next.trim()||next.trim()===oldGroup)return;const group=next.trim();
  STATE.forEach(r=>{if(r.main===main&&r.group===oldGroup)r.group=group});
  EXTRA_GROUPS[main]=(EXTRA_GROUPS[main]||[]).filter(g=>g!==oldGroup);if(!EXTRA_GROUPS[main].includes(group))EXTRA_GROUPS[main].push(group);
  if(F.folder===main&&F.group===oldGroup)F.group=group;persist();render();
}
function deleteSubfolder(main,group){
  const count=STATE.filter(r=>r.main===main&&r.group===group).length;
  if(!confirm(`Delete subfolder "${group}" and all ${count} document${count===1?'':'s'} inside it?`))return;
  snapshotForUndo(`Deleted subfolder “${group}”`);
  STATE=STATE.filter(r=>!(r.main===main&&r.group===group));EXTRA_GROUPS[main]=(EXTRA_GROUPS[main]||[]).filter(g=>g!==group);F.group='All';persist();render();
}

function filtered(){
  const q=F.q.trim().toLowerCase();
  return STATE.filter(r=>{
    if(F.folder!=="All"&&r.main!==F.folder)return false;
    if(F.group!=="All"&&(r.group||"")!==F.group)return false;
    if(F.status!=="All"&&r.status!==F.status)return false;
    if(F.resp!=="All"&&(r.resp||"")!==F.resp)return false;
    if(q){ const hay=(r.main+" "+r.group+" "+r.title+" "+(r.rem||"")+" "+(r.resp||"")).toLowerCase(); if(!hay.includes(q))return false; }
    return true;
  });
}

function renderRows(){
  const rows=filtered();
  const folderOrder=Array.from(new Set(STATE.map(r=>r.main)));
  const groupOrder={};STATE.forEach(r=>{groupOrder[r.main]=groupOrder[r.main]||[];const g=r.group||'';if(!groupOrder[r.main].includes(g))groupOrder[r.main].push(g)});
  rows.sort((a,b)=>{const fm=folderOrder.indexOf(a.main)-folderOrder.indexOf(b.main);if(fm)return fm;const gm=(groupOrder[a.main]||[]).indexOf(a.group||'')-(groupOrder[b.main]||[]).indexOf(b.group||'');if(gm)return gm;return a.id-b.id});
  const tb=document.getElementById('tb');
  document.getElementById('count').textContent = rows.length===STATE.length? `${STATE.length} items` : `${rows.length} of ${STATE.length}`;
  if(!rows.length){
    if(F.folder!=="All"&&STATE.every(r=>r.main!==F.folder))tb.innerHTML=`<tr class="grouprow"><td colspan="8"><div class="groupHead"><span>${esc(F.folder)}</span>${mainFolderActions(F.folder)}</div></td></tr><tr><td colspan="8" class="empty">This folder is empty. Use Add Document or Add Subfolder above.</td></tr>`;
    else tb.innerHTML=`<tr><td colspan="8" class="empty">No documents match your filters.</td></tr>`;
    return;
  }
  let html=''; let curFolder=null,curGroup=null;
  rows.forEach(r=>{
    if(r.main!==curFolder){ curFolder=r.main;curGroup=null;html+=`<tr class="grouprow"><td colspan="8"><div class="groupHead"><span>${esc(r.main)}</span>${mainFolderActions(r.main)}</div></td></tr>`; }
    if(r.group&&r.group!==curGroup){curGroup=r.group;html+=`<tr class="subgrouprow"><td></td><td colspan="7"><div class="subgroupHead"><span>${esc(r.group)}</span><span class="groupHeadActions"><button class="miniBtn" onclick="addDocumentTo('${escAttr(r.main)}','${escAttr(r.group)}')">＋ Add Document</button><button class="miniBtn" onclick="addNestedSubfolder('${escAttr(r.main)}','${escAttr(r.group)}')">＋ Add Subfolder</button><button class="miniBtn" onclick="renameSubfolder('${escAttr(r.main)}','${escAttr(r.group)}')">Rename</button><button class="miniBtn danger" onclick="deleteSubfolder('${escAttr(r.main)}','${escAttr(r.group)}')">Delete</button></span></div></td></tr>`;}
    html+=`<tr data-id="${r.id}">
      <td class="idc">${r.id}</td>
      <td><input class="cell" data-f="group" value="${esc(r.group||'')}" placeholder="—" style="min-width:120px"></td>
      <td><div class="cell titlecell" contenteditable="true" data-f="title" data-ph="Document name">${esc(r.title||'')}</div></td>
      <td><select class="st ${STCLASS[r.status]||'st-ns'}" data-f="status">${statusesFor(r).map(st=>`<option ${r.status===st?'selected':''}>${esc(st)}</option>`).join('')}</select></td>
      <td><input class="cell" data-f="resp" value="${esc(r.resp||'')}" placeholder="—"></td>
      <td><input class="cell" type="date" data-f="date" value="${esc(r.date||'')}"></td>
      <td><div class="cell remarksCell" contenteditable="true" data-f="rem" data-ph="Add remarks…">${esc(r.rem||'')}</div></td>
      <td><button class="del" data-del="${r.id}" title="Delete document">Delete</button></td>
    </tr>`;
  });
  tb.innerHTML=html;
  tb.querySelectorAll('tr[data-id]').forEach(tr=>{
    const id=+tr.getAttribute('data-id');
    tr.querySelectorAll('[data-f]').forEach(el=>{
      const f=el.getAttribute('data-f');
      const ev = el.tagName==='SELECT'||el.type==='date' ? 'change':'input';
      el.addEventListener(ev, ()=>{
        const item=STATE.find(x=>x.id===id); if(!item)return;
        const val = el.isContentEditable ? el.textContent : el.value;
        item[f]=val;
        if(f==='status'){ el.className='st '+(STCLASS[val]||'st-ns'); refreshSummary(); }
        persist();
      });
    });
  });
  tb.querySelectorAll('.del').forEach(b=>b.addEventListener('click',()=>deleteRow(+b.getAttribute('data-del'))));
}

function newId(){ return (STATE.reduce((m,r)=>Math.max(m,r.id||0),0))+1; }
function addRow(){
  const main = (F.folder!=="All") ? F.folder : (Array.from(new Set(STATE.map(r=>r.main)))[0]||"01 – General");
  const it={id:newId(), main, group:"", title:"", status:(/^04/.test(main)?"To be uploaded":"Not Started"), resp:"", date:"", rem:""};
  STATE.push(it); persist(); render();
  // focus the new document title
  const el=document.querySelector(`tr[data-id="${it.id}"] [data-f="title"]`);
  if(el){ el.scrollIntoView({block:"center"}); el.focus(); }
}
function deleteRow(id){
  const it=STATE.find(x=>x.id===id); if(!it)return;
  if(!confirm(`Delete "${it.title||'this document'}"?`)) return;
  snapshotForUndo(`Deleted document “${it.title||'Untitled'}”`);
  STATE = STATE.filter(x=>x.id!==id); persist(); render();
}
function backup(){
  const data=JSON.stringify({exportedAt:new Date().toISOString(),documentCount:STATE.length,rows:STATE,groups:EXTRA_GROUPS,meta:META},null,1);
  (async()=>{
    const dl=(window.claude&&claude.use)?await claude.use('downloads'):null;
    if(dl){ try{ await dl.save({filename:'Villa606_tracker_data.json', data}); return; }catch(e){} }
    try{ const b=new Blob([data],{type:'application/json'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download='Villa606_tracker_data.json'; a.click(); URL.revokeObjectURL(u);}catch(e){ alert('Backup not available in this view.'); }
  })();
}
function restore(file){
  const rd=new FileReader();
  rd.onload=()=>{ try{ const data=JSON.parse(rd.result);const arr=Array.isArray(data)?data:data.rows;if(Array.isArray(arr)){const when=(!Array.isArray(data)&&data.exportedAt)?new Date(data.exportedAt).toLocaleString():'date unavailable';if(!confirm(`Restore backup with ${arr.length} documents?\nBackup date: ${when}\n\nYour current browser data will be replaced.`))return;snapshotForUndo('Restored a backup');STATE=arr.map((r,i)=>({id:r.id||i+1,main:r.main||"",group:r.group||"",title:r.title||"",status:r.status||"Not Started",resp:r.resp||"",date:r.date||"",rem:r.rem||""}));EXTRA_GROUPS=(!Array.isArray(data)&&data.groups)||{};if(!Array.isArray(data)&&data.meta)META={...META,...data.meta};persist();render();showUndo('Backup restored · Undo available'); } else alert('That file has no document rows.'); }catch(e){ alert('Could not read that file — expected a JSON backup.'); } };
  rd.readAsText(file);
}

  if(statusSummary){statusSummary.outerHTML=statusBreakdownHTML();}
  const folders=Array.from(new Set(STATE.map(r=>r.main).concat(Object.keys(EXTRA_GROUPS))));
  const fwrap=root.querySelector('.folders');
  if(fwrap){ fwrap.innerHTML = foldersHTML(folders,fs); }
}
function kpisHTML(s){return `<div class="kpis">
  <div class="kpi hl"><p class="k">Overall progressed</p><p class="v num">${s.progressPct}<small>%</small></p><div class="bar"><span style="width:${s.progressPct}%"></span></div></div>
  <div class="kpi"><p class="k">Overall complete</p><p class="v num">${s.pct}<small>%</small></p><div class="bar"><span style="width:${s.pct}%"></span></div></div>
  <div class="kpi"><p class="k">Total documents</p><p class="v num">${s.t}</p></div>
  <div class="kpi"><p class="k">Completed / approved</p><p class="v num" style="color:var(--rc)">${s.done}</p></div>
  <div class="kpi"><p class="k">In progress</p><p class="v num" style="color:var(--ip)">${s.ip}</p></div>
  <div class="kpi"><p class="k">Not started</p><p class="v num" style="color:var(--ns)">${s.init}</p></div></div>`;}
function statusBreakdownHTML(){
  const counts={};STATE.forEach(r=>counts[r.status||'Not Started']=(counts[r.status||'Not Started']||0)+1);
  return `<div class="statusSummary"><span class="statusTotal">Status total · ${STATE.length}</span>${ALL_STATUSES.filter(s=>counts[s]).map(s=>`<button class="statusChip ${F.status===s?'active':''}" onclick="selectStatus('${escAttr(s)}')"><span>${esc(s)}</span><b>${counts[s]}</b></button>`).join('')}</div>`;
}
function selectStatus(status){F.status=status;render();setTimeout(()=>document.querySelector('.tablecard')?.scrollIntoView({behavior:'smooth',block:'start'}),50)}
function foldersHTML(folders,fs){return folders.map(f=>{const d=fs[f]||{t:0,done:0,na:0,progressed:0};const dn=d.t-d.na;const p=dn>0?Math.round(d.progressed/dn*100):0;const cp=dn>0?Math.round(d.done/dn*100):0;return `
  <div class="fcard ${F.folder===f?'active':''}" role="button" tabindex="0" onclick="selectFolder('${escAttr(f)}')" onkeydown="if(event.key==='Enter')selectFolder('${escAttr(f)}')"><p class="ft">${esc(f)}</p><p class="fm">${d.progressed} of ${dn} progressed · ${d.done} complete${d.na?` · ${d.na} N/A`:''}</p>
  <div class="bar"><span style="width:${p}%"></span></div><div class="fp"><span class="fm">${d.t} items · ${cp}% complete</span><b class="num">${p}% progressed</b></div></div>`;}).join('');}

function wireToolbar(){
  const q=document.getElementById('q');
  q.addEventListener('input',()=>{F.q=q.value;renderRows();});
  document.getElementById('fFolder').addEventListener('change',e=>{F.folder=e.target.value;F.group='All';render();});
  document.getElementById('fGroup').addEventListener('change',e=>{F.group=e.target.value;renderRows();const p=document.getElementById('subfolderPanel');if(p)p.innerHTML=subfoldersHTML();});
  document.getElementById('fStatus').addEventListener('change',e=>{F.status=e.target.value;renderRows();});
  document.getElementById('fResp').addEventListener('change',e=>{F.resp=e.target.value;renderRows();});
  document.getElementById('clear').addEventListener('click',()=>{F.q="";F.folder="All";F.group="All";F.status="All";F.resp="All";render();});
  document.getElementById('csv').addEventListener('click',exportCSV);
  document.getElementById('addFolder').addEventListener('click',addMainFolder);
  document.getElementById('saveNow').addEventListener('click',saveNow);
  document.getElementById('downloadHtml').addEventListener('click',downloadHTML);
  document.getElementById('pdfFull').addEventListener('click',()=>printReport('full'));
  document.getElementById('pdfFolder').addEventListener('click',()=>printReport('current'));
  document.getElementById('backup').addEventListener('click',backup);
  const rf=document.getElementById('restoreFile');
  document.getElementById('restore').addEventListener('click',()=>rf.click());
  rf.addEventListener('change',()=>{ if(rf.files&&rf.files[0]){ restore(rf.files[0]); rf.value=''; } });
}

function wireMeta(){document.querySelectorAll('[data-meta]').forEach(el=>el.addEventListener('input',()=>{META[el.getAttribute('data-meta')]=el.textContent.trim();persist()}))}
function saveNow(){try{localStorage.setItem(LSKEY,JSON.stringify({t:Date.now(),s:STATE,g:EXTRA_GROUPS,m:META}));setSave('Saved to this browser · download HTML for another device',false)}catch(e){setSave('Browser save unavailable · download HTML now',true)}if(ARTIFACT)doPublish()}
function printReport(mode){
  if(mode==='current'&&F.folder==='All'){alert('Select a main folder first, then choose PDF · Current folder.');return;}
  const old={...F};
  if(mode==='full'){F.q='';F.folder='All';F.group='All';F.status='All';F.resp='All';}
  else{F.q='';F.group='All';F.status='All';F.resp='All';document.body.classList.add('print-current')}
  render();
  const restore=()=>{document.body.classList.remove('print-current');Object.assign(F,old);render();window.removeEventListener('afterprint',restore)};
  window.addEventListener('afterprint',restore);setTimeout(()=>window.print(),80);
}

function setSave(txt,warn){ const d=document.getElementById('savedot'),t=document.getElementById('savetxt'); if(t)t.textContent=txt; if(d)d.className='dot'+(warn?' warn':''); }

function buildDoc(){
  const json=JSON.stringify(STATE).replace(/<\//g,'<\\/');
  const groupJson=JSON.stringify(EXTRA_GROUPS).replace(/<\//g,'<\\/');
  const metaJson=JSON.stringify(META).replace(/<\//g,'<\\/');
  const app=document.getElementById('app-script').textContent;
  return '<!doctype html><html lang="en"><head><meta charset="utf-8">'
    +'<meta name="viewport" content="width=device-width, initial-scale=1">'
    +'<title>Villa 606 Document Tracker</title>'
    +'<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;500;600;700;800&display=swap">'
    +'</head><body>'
    +'<div id="root"></div>'
    +'<script id="app-state" type="application/json">'+json+'<\/script>'
    +'<script id="folder-state" type="application/json">'+groupJson+'<\/script>'
    +'<script id="meta-state" type="application/json">'+metaJson+'<\/script>'
    +'<script id="app-script">'+app+'<\/script>'
    +'</body></html>';
}
function downloadHTML(){
  try{localStorage.setItem(LSKEY,JSON.stringify({t:Date.now(),s:STATE,g:EXTRA_GROUPS,m:META}));}catch(e){}
  const blob=new Blob([buildDoc()],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='Villa_606_Interactive_Document_Dashboard.html';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1200);setSave('Downloaded with latest changes',false);
}

let pubTimer=null, pending=false, publishing=false;
function persist(){
  try{ localStorage.setItem(LSKEY, JSON.stringify({t:Date.now(), s:STATE, g:EXTRA_GROUPS, m:META})); }catch(e){}
  setSave('Saving…',true);
  pending=true;
  clearTimeout(pubTimer);
  pubTimer=setTimeout(doPublish, 900);
}
async function doPublish(){
  if(publishing){ return; }
  if(!ARTIFACT){ setSave(capReady?'Saved to this browser':'Saving locally…', !capReady); pending=false; return; }
  publishing=true; pending=false;
  try{
    await ARTIFACT.publish(buildDoc());
    setSave('All changes saved',false);
  }catch(e){
    setSave('Save conflict — reloading latest',true);
  }finally{
    publishing=false;
    if(pending){ pubTimer=setTimeout(doPublish,600); }
  }
}

function exportCSV(){
  const head=["No","Main Folder","Section","Document","Status","Responsible","Status Date","Remarks"];
  const q=c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"';
  const lines=[head.map(q).join(',')];
  STATE.forEach(r=>lines.push([r.id,r.main,r.group,r.title,r.status,r.resp,r.date,r.rem].map(q).join(',')));
  const data=lines.join('\r\n');
  (async()=>{
    const dl = (window.claude&&claude.use)? await claude.use('downloads') : null;
    if(dl){ try{ await dl.save({filename:'Villa606_Document_Tracker.csv', data}); return; }catch(e){} }
    // fallback (works in normal browser tab; may be blocked in sandbox)
    try{ const b=new Blob([data],{type:'text/csv'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download='Villa606_Document_Tracker.csv'; a.click(); URL.revokeObjectURL(u);}catch(e){ alert('Export not available in this view.'); }
  })();
}

// boot
function overlayLocal(){
  try{
    const ls=JSON.parse(localStorage.getItem(LSKEY));
    if(ls&&Array.isArray(ls.s)){
      STATE=ls.s.map((r,i)=>({id:r.id||i+1,main:r.main||'',group:r.group||'',title:r.title||'',status:r.status||'Not Started',resp:r.resp||'',date:r.date||'',rem:r.rem||''}));
      EXTRA_GROUPS=ls.g||EXTRA_GROUPS;
      if(ls.m)META={...META,...ls.m};
    }
  }catch(e){}
}
render();
(async()=>{
  if(window.claude&&claude.use){
    ARTIFACT = await claude.use('artifact');
  }
  capReady=true;
  if(ARTIFACT){ setSave('All changes saved',false); }
  else{ overlayLocal(); render(); setSave('Saving to this browser',true); }
})();
</script></body></html>
