*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Reddit Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5;font-size:15px;-webkit-font-smoothing:antialiased}
.wrap{width:100%;max-width:none;margin:0;padding:clamp(16px,2vw,30px) clamp(10px,1.5vw,24px) 48px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 10px}
h1{font-family:"Reddit Sans",system-ui,sans-serif;font-weight:500;font-size:clamp(1.7rem,3.5vw,2.5rem);line-height:1.05;letter-spacing:-.01em;margin:0 0 8px;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin:0}
.savebar{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:.78rem;color:var(--muted)}
.editableMeta{border:1px solid transparent;border-radius:7px;padding:2px 5px;margin-left:-5px;cursor:text}.editableMeta:hover{border-color:var(--line)}.editableMeta:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--rc)}
.dot.warn{background:var(--ip)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin:26px 0}
.kpi{background:var(--surface);padding:16px 18px}
.kpi .k{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.kpi .v{font-family:"Reddit Sans",system-ui,sans-serif;font-size:1.9rem;font-weight:500;line-height:1;margin:0;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:.85rem;color:var(--muted);font-family:"Reddit Sans",sans-serif}
.kpi.hl{background:var(--accent-soft)} .kpi.hl .v{color:var(--accent-ink)}

`;
const STATUSES = ["Not Started","In Progress","Submitted","Received","Approved","Closed","N/A"];

STATE.forEach(r=>{EXTRA_GROUPS[r.main]=EXTRA_GROUPS[r.main]||[];if(r.group&&!EXTRA_GROUPS[r.main].includes(r.group))EXTRA_GROUPS[r.main].push(r.group);});

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shortFolder(m){return m;}
function stats(){
  const t=STATE.length; let done=0,na=0,init=0,ip=0,ipOnly=0,wipOnly=0,faOnly=0,tbuOnly=0,progressed=0,snagWip=0,snagDone=0,snagTotal=0,desnagApproval=0,desnagTotal=0,finalDone=0,finalTotal=0;
  STATE.forEach(r=>{
    if(r.status==="N/A")na++;

    if(r.status==="Not Started"||!r.status)init++;
    if(r.status==="In Progress"||r.status==="Work In progress"||r.status==="For Approval"){ip++;if(r.status==="In Progress")ipOnly++;if(r.status==="Work In progress")wipOnly++;if(r.status==="For Approval")faOnly++;}
    if(r.status!=="N/A"&&!UNSTARTED.has(r.status))progressed++;
    if(r.main==="04 – Snagging"&&(r.group||"").startsWith("Snag Report")){snagTotal++;if(r.status==="Work In progress")snagWip++;if(r.status==="Work Completed")snagDone++;}
    if(r.main==="04 – Snagging"&&(r.group||"").startsWith("De-snag")){desnagTotal++;if(r.status==="For Approval")desnagApproval++;}
    if(r.main==="04 – Snagging"&&(r.group||"").startsWith("Approved Final")){finalTotal++;if(r.status==="Approved")finalDone++;}
  });
  const denom=t-na; const pct=denom>0?Math.round(done/denom*100):0;const progressPct=denom>0?Math.round(progressed/denom*100):0;
  return {t,done,na,init,ip,ipOnly,wipOnly,faOnly,tbuOnly,progressed,denom,pct,progressPct,snagWip,snagDone,snagTotal,desnagApproval,desnagTotal,finalDone,finalTotal};

function folderStats(){

function distinctResp(){ return Array.from(new Set(STATE.map(r=>r.resp).filter(Boolean))).sort(); }

    </section>

    <div class="toolbar">

      <select id="fGroup"><option>All</option>${groupsForFolder().map(g=>`<option ${F.group===g?'selected':''}>${esc(g)}</option>`).join('')}</select>
      <select id="fStatus"><option>All</option>${ALL_STATUSES.map(st=>`<option ${F.status===st?'selected':''}>${esc(st)}</option>`).join('')}</select>
      <select id="fResp"><option>All</option>${respOpts.map(r=>`<option ${F.resp===r?'selected':''}>${esc(r)}</option>`).join('')}</select>
      <button class="btn ghost" id="clear">Clear</button>
      <button class="btn ghost" id="addFolder">+ Main folder</button>

      <button class="btn ghost" id="pdfFolder">PDF · Current folder</button>

    <div class="tablecard scroll">

        <colgroup>
          <col style="width:3%"><col style="width:12%"><col style="width:16%"><col style="width:10%">
          <col style="width:10%"><col style="width:9%"><col style="width:20%"><col style="width:14%"><col style="width:6%">
        </colgroup>
        <thead><tr>
          <th>#</th><th>Section</th><th>Document</th><th>Status</th><th>Responsible</th><th>Status date</th><th>Remarks</th><th>Document Link</th><th></th>
        </tr></thead>

      </table>
    </div>
    <footer class="editableMeta" contenteditable="true" data-meta="footer">${esc(META.footer)}</footer>
  </div>`;

  root.insertAdjacentHTML('beforeend','<div class="undoBar" id="undoBar"><span id="undoText"></span><button id="undoBtn">Undo</button></div>');

  wireToolbar();
  wireMeta();
  renderRows();
  if(LAST_UNDO)showUndo(LAST_UNDO.label);
}

function renderRows(){
  const rows=filtered();
  const folderOrder=Array.from(new Set(STATE.map(r=>r.main)));
  const groupOrder={};STATE.forEach(r=>{groupOrder[r.main]=groupOrder[r.main]||[];const g=r.group||'';if(!groupOrder[r.main].includes(g))groupOrder[r.main].push(g)});
  rows.sort((a,b)=>{const fm=folderOrder.indexOf(a.main)-folderOrder.indexOf(b.main);if(fm)return fm;const gm=(groupOrder[a.main]||[]).indexOf(a.group||'')-(groupOrder[b.main]||[]).indexOf(b.group||'');if(gm)return gm;return a.id-b.id});
  const tb=document.getElementById('tb');
  document.getElementById('count').textContent = rows.length===STATE.length? `${STATE.length} items` : `${rows.length} of ${STATE.length}`;
  if(!rows.length){
    if(F.folder!=="All"&&STATE.every(r=>r.main!==F.folder))tb.innerHTML=`<tr class="grouprow"><td colspan="9"><div class="groupHead"><span>${esc(F.folder)}</span>${mainFolderActions(F.folder)}</div></td></tr><tr><td colspan="9" class="empty">This folder is empty. Use Add Document or Add Subfolder above.</td></tr>`;
    else tb.innerHTML=`<tr><td colspan="9" class="empty">No documents match your filters.</td></tr>`;
    return;
  }
  let html=''; let curFolder=null,curGroup=null;
  rows.forEach(r=>{
    if(r.main!==curFolder){ curFolder=r.main;curGroup=null;html+=`<tr class="grouprow"><td colspan="9"><div class="groupHead"><span>${esc(r.main)}</span>${mainFolderActions(r.main)}</div></td></tr>`; }
    if(r.group&&r.group!==curGroup){curGroup=r.group;const ckey=r.main+'|||'+r.group;const isColl=COLLAPSED.has(ckey);html+=`<tr class="subgrouprow${isColl?' collapsed':''}" data-ckey="${escAttr(ckey)}"><td></td><td colspan="8"><div class="subgroupHead"><span><span class="toggle" onclick="toggleSubgroup(this)"></span>${esc(r.group)}</span><span class="groupHeadActions"><button class="miniBtn" onclick="addDocumentTo('${escAttr(r.main)}','${escAttr(r.group)}')">＋ Add Document</button><button class="miniBtn" onclick="addNestedSubfolder('${escAttr(r.main)}','${escAttr(r.group)}')">＋ Add Subfolder</button><button class="miniBtn" onclick="renameSubfolder('${escAttr(r.main)}','${escAttr(r.group)}')">Rename</button><button class="miniBtn danger" onclick="deleteSubfolder('${escAttr(r.main)}','${escAttr(r.group)}')">Delete</button></span></div></td></tr>`;}
    const isHidden=r.group&&COLLAPSED.has(r.main+'|||'+r.group);
    html+=`<tr data-id="${r.id}"${isHidden?' hidden':''}>`+`
      <td class="idc">${r.id}</td>
      <td><input class="cell" data-f="group" value="${esc(r.group||'')}" placeholder="—" style="min-width:120px"></td>
      <td><div class="cell titlecell" contenteditable="true" data-f="title" data-ph="Document name">${esc(r.title||'')}</div></td>
      <td><select class="st ${STCLASS[r.status]||'st-ns'}" data-f="status">${statusesFor(r).map(st=>`<option ${r.status===st?'selected':''}>${esc(st)}</option>`).join('')}</select></td>
      <td><input class="cell" data-f="resp" value="${esc(r.resp||'')}" placeholder="—"></td>
      <td><input class="cell" type="date" data-f="date" value="${esc(r.date||'')}"></td>
      <td><div class="cell remarksCell" contenteditable="true" data-f="rem" data-ph="Add remarks…">${esc(r.rem||'')}</div></td>
      <td><div class="linkCell"><input class="cell docLinkInput" type="url" data-f="link" value="${esc(r.link||'')}" placeholder="Paste document link…"><a class="openLink ${normalizeDocLink(r.link)?'':'disabled'}" data-open-link="${r.id}" href="${esc(normalizeDocLink(r.link)||'#')}" target="_blank" rel="noopener noreferrer">Open</a></div></td>
      <td><button class="del" data-del="${r.id}" title="Delete document">Delete</button></td>
    </tr>`;
  });
  tb.innerHTML=html;
  tb.querySelectorAll('tr[data-id]').forEach(tr=>{
    const id=+tr.getAttribute('data-id');
    tr.querySelectorAll('[data-f]').forEach(el=>{
      const f=el.getAttribute('data-f');
      const ev = el.tagName==='SELECT'||el.type==='date' ? 'change':'input';
      el.addEventListener(ev, ()=>{
        const item=STATE.find(x=>x.id===id); if(!item)return;
        const val = el.isContentEditable ? el.textContent : el.value;
        item[f]=val;
        if(f==='status'){ el.className='st '+(STCLASS[val]||'st-ns'); refreshSummary(); }
        if(f==='link'){
          const a=tr.querySelector(`[data-open-link="${id}"]`);
          const href=normalizeDocLink(val);
          if(a){a.href=href||'#';a.classList.toggle('disabled',!href);}
        }
        persist(id,f);
      });
    });
  });
  tb.querySelectorAll('.del').forEach(b=>b.addEventListener('click',()=>deleteRow(+b.getAttribute('data-del'))));
}

function newId(){ return (STATE.reduce((m,r)=>Math.max(m,r.id||0),0))+1; }
function addRow(){
  const main = (F.folder!=="All") ? F.folder : (Array.from(new Set(STATE.map(r=>r.main)))[0]||"01 – General");
  const it={id:newId(), main, group:"", title:"", status:(/^04/.test(main)?"To be uploaded":"Not Started"), resp:"", date:"", rem:"", link:""};
  STATE.push(it); persist(); render();
  // focus the new document title
  const el=document.querySelector(`tr[data-id="${it.id}"] [data-f="title"]`);
  if(el){ el.scrollIntoView({block:"center"}); el.focus(); }
}
function deleteRow(id){
  const it=STATE.find(x=>x.id===id); if(!it)return;
  if(!confirm(`Delete "${it.title||'this document'}"?`)) return;
  snapshotForUndo(`Deleted document “${it.title||'Untitled'}”`);
  STATE = STATE.filter(x=>x.id!==id); persist(); render();
}
function backup(){
  const data=JSON.stringify({exportedAt:new Date().toISOString(),documentCount:STATE.length,rows:STATE,groups:EXTRA_GROUPS,meta:META},null,1);
  (async()=>{
    const dl=(window.claude&&claude.use)?await claude.use('downloads'):null;
    if(dl){ try{ await dl.save({filename:'Villa606_tracker_data.json', data}); return; }catch(e){} }
    try{ const b=new Blob([data],{type:'application/json'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download='Villa606_tracker_data.json'; a.click(); URL.revokeObjectURL(u);}catch(e){ alert('Backup not available in this view.'); }
  })();
}
function restore(file){
  const rd=new FileReader();
  rd.onload=()=>{ try{ const data=JSON.parse(rd.result);const arr=Array.isArray(data)?data:data.rows;if(Array.isArray(arr)){const when=(!Array.isArray(data)&&data.exportedAt)?new Date(data.exportedAt).toLocaleString():'date unavailable';if(!confirm(`Restore backup with ${arr.length} documents?\nBackup date: ${when}\n\nYour current browser data will be replaced.`))return;snapshotForUndo('Restored a backup');STATE=arr.map((r,i)=>({id:r.id||i+1,main:r.main||"",group:r.group||"",title:r.title||"",status:r.status||"Not Started",resp:r.resp||"",date:r.date||"",rem:r.rem||"",link:r.link||""}));EXTRA_GROUPS=(!Array.isArray(data)&&data.groups)||{};if(!Array.isArray(data)&&data.meta)META={...META,...data.meta};persist();render();showUndo('Backup restored · Undo available'); } else alert('That file has no document rows.'); }catch(e){ alert('Could not read that file — expected a JSON backup.'); } };
  rd.readAsText(file);
}

function refreshSummary(){
  // lightweight re-render of KPI + folders without rebuilding table (keeps focus)
  const s=stats(); const fs=folderStats();
  const root=document.getElementById('root');
  const kpis=root.querySelector('.kpisWrap');
  if(kpis){ kpis.outerHTML = kpisHTML(s); }
  const statusSummary=root.querySelector('.statusSummary');
  if(statusSummary){statusSummary.outerHTML=statusBreakdownHTML();}
  const folders=Array.from(new Set(STATE.map(r=>r.main).concat(Object.keys(EXTRA_GROUPS))));
  const fwrap=root.querySelector('.folders');
  if(fwrap){ fwrap.innerHTML = foldersHTML(folders,fs); }
}
function kpisHTML(s){return `<div class="kpisWrap"><div class="kpis">
  <div class="kpi hl"><p class="k">Overall progressed</p><p class="v num">${s.progressPct}<small>%</small></p><div class="bar"><span style="width:${s.progressPct}%"></span></div></div>
  <div class="kpi"><p class="k">Overall complete</p><p class="v num">${s.pct}<small>%</small></p><div class="bar"><span style="width:${s.pct}%"></span></div></div>
  <div class="kpi"><p class="k">Total documents</p><p class="v num">${s.t}</p></div>
  <div class="kpi"><p class="k">Completed / approved</p><p class="v num" style="color:var(--rc)">${s.done}</p><p class="k" style="font-size:0.65rem;line-height:1.3;margin-top:2px;opacity:0.75">${s.denom>0?Math.round(s.done/s.denom*100):0}%</p></div>
  <div class="kpi"><p class="k">In progress</p><p class="v num" style="color:var(--ip)">${s.ip}</p><p class="k" style="font-size:0.65rem;line-height:1.3;margin-top:2px;opacity:0.75">${s.denom>0?Math.round(s.ip/s.denom*100):0}% · ${s.ipOnly+s.wipOnly} in progress · ${s.faOnly} for approval</p></div>
  <div class="kpi"><p class="k">Not started</p><p class="v num" style="color:var(--ns)">${s.init}</p><p class="k" style="font-size:0.65rem;line-height:1.3;margin-top:2px;opacity:0.75">${s.denom>0?Math.round(s.init/s.denom*100):0}%</p></div></div>
  <div class="kpis" style="margin-top:12px">
  <div class="kpi" style="cursor:pointer" onclick="filterSnagKpi('Snag Report','Work In progress')"><p class="k">Snag Report — Work in Progress</p><p class="v num" style="color:var(--ip)">${s.snagWip} <small>/ ${s.snagTotal}</small></p></div>
  <div class="kpi" style="cursor:pointer" onclick="filterSnagKpi('Snag Report','Work Completed')"><p class="k">Snag Report — Work Completed</p><p class="v num" style="color:var(--rc)">${s.snagDone} <small>/ ${s.snagTotal}</small></p></div>
  <div class="kpi" style="cursor:pointer" onclick="filterSnagKpi('De-snag','For Approval')"><p class="k">De-snag — For Approval</p><p class="v num" style="color:var(--sub)">${s.desnagApproval} <small>/ ${s.desnagTotal}</small></p></div>
  <div class="kpi hl" style="cursor:pointer" onclick="filterSnagKpi('Approved Final','Approved')"><p class="k">Final Snagging — Approved</p><p class="v num" style="color:var(--rc)">${s.finalDone} <small>/ ${s.finalTotal}</small></p><div class="bar"><span style="width:${s.finalTotal>0?Math.round(s.finalDone/s.finalTotal*100):0}%"></span></div></div></div></div>`;}
function statusBreakdownHTML(){
  const counts={};STATE.forEach(r=>counts[r.status||'Not Started']=(counts[r.status||'Not Started']||0)+1);
  return `<div class="statusSummary"><span class="statusTotal">Status total · ${STATE.length}</span>${ALL_STATUSES.filter(s=>counts[s]).map(s=>`<button class="statusChip ${F.status===s?'active':''}" onclick="selectStatus('${escAttr(s)}')"><span>${esc(s)}</span><b>${counts[s]}</b></button>`).join('')}</div>`;
}
function selectStatus(status){F.status=status;render();setTimeout(()=>document.querySelector('.tablecard')?.scrollIntoView({behavior:'smooth',block:'start'}),50)}
function filterSnagKpi(groupPrefix,status){F.folder='04 – Snagging';F.group='All';F.status=status;render();setTimeout(()=>document.querySelector('.tablecard')?.scrollIntoView({behavior:'smooth',block:'start'}),50)}
function foldersHTML(folders,fs){return folders.map(f=>{const d=fs[f]||{t:0,done:0,na:0,progressed:0};const dn=d.t-d.na;const p=dn>0?Math.round(d.progressed/dn*100):0;const cp=dn>0?Math.round(d.done/dn*100):0;return `
  <div class="fcard ${F.folder===f?'active':''}" role="button" tabindex="0" onclick="selectFolder('${escAttr(f)}')" onkeydown="if(event.key==='Enter')selectFolder('${escAttr(f)}')"><p class="ft">${esc(f)}</p><p class="fm">${d.progressed} of ${dn} progressed · ${d.done} complete${d.na?` · ${d.na} N/A`:''}</p>
  <div class="bar"><span style="width:${p}%"></span></div><div class="fp"><span class="fm">${d.t} items · ${cp}% complete</span><b class="num">${p}% progressed</b></div></div>`;}).join('');}

function wireToolbar(){
  const q=document.getElementById('q');
  q.addEventListener('input',()=>{F.q=q.value;renderRows();});
  document.getElementById('fFolder').addEventListener('change',e=>{F.folder=e.target.value;F.group='All';render();});
  document.getElementById('fGroup').addEventListener('change',e=>{F.group=e.target.value;renderRows();const p=document.getElementById('subfolderPanel');if(p)p.innerHTML=subfoldersHTML();});
  document.getElementById('fStatus').addEventListener('change',e=>{F.status=e.target.value;renderRows();});
  document.getElementById('fResp').addEventListener('change',e=>{F.resp=e.target.value;renderRows();});
  document.getElementById('clear').addEventListener('click',()=>{F.q="";F.folder="All";F.group="All";F.status="All";F.resp="All";render();});
  document.getElementById('csv').addEventListener('click',exportCSV);
  document.getElementById('addFolder').addEventListener('click',addMainFolder);
  document.getElementById('saveNow').addEventListener('click',saveNow);
  document.getElementById('downloadHtml').addEventListener('click',downloadHTML);
  document.getElementById('pdfFull').addEventListener('click',()=>printReport('full'));
  document.getElementById('pdfFolder').addEventListener('click',()=>printReport('current'));
  document.getElementById('backup').addEventListener('click',backup);
  const rf=document.getElementById('restoreFile');
  document.getElementById('restore').addEventListener('click',()=>rf.click());
  rf.addEventListener('change',()=>{ if(rf.files&&rf.files[0]){ restore(rf.files[0]); rf.value=''; } });
}

function wireMeta(){document.querySelectorAll('[data-meta]').forEach(el=>el.addEventListener('input',()=>{META[el.getAttribute('data-meta')]=el.textContent.trim();persist()}))}
async function saveNow(){ await saveShared(); }
function printReport(mode){
  if(mode==='current'&&F.folder==='All'){alert('Select a main folder first, then choose PDF · Current folder.');return;}
  const old={...F};
  if(mode==='full'){F.q='';F.folder='All';F.group='All';F.status='All';F.resp='All';}
  else{F.q='';F.group='All';F.status='All';F.resp='All';document.body.classList.add('print-current')}
  render();
  const restore=()=>{document.body.classList.remove('print-current');Object.assign(F,old);render();window.removeEventListener('afterprint',restore)};
  window.addEventListener('afterprint',restore);setTimeout(()=>window.print(),80);
}

function setSave(txt,warn){ const d=document.getElementById('savedot'),t=document.getElementById('savetxt'); if(t)t.textContent=txt; if(d)d.className='dot'+(warn?' warn':''); }

function buildDoc(){
  const json=JSON.stringify(STATE).replace(/<\//g,'<\\/');
  const groupJson=JSON.stringify(EXTRA_GROUPS).replace(/<\//g,'<\\/');
  const metaJson=JSON.stringify(META).replace(/<\//g,'<\\/');
  const app=document.getElementById('app-script').textContent;
  return '<!doctype html><html lang="en"><head><meta charset="utf-8">'
    +'<meta name="viewport" content="width=device-width, initial-scale=1">'
    +'<title>Villa 606 Document Tracker</title>'
    +'<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reddit+Sans:wght@400;500;600;700;800&display=swap">'
    +'</head><body>'
    +'<div id="root"></div>'
    +'<script id="app-state" type="application/json">'+json+'<\/script>'
    +'<script id="folder-state" type="application/json">'+groupJson+'<\/script>'
    +'<script id="meta-state" type="application/json">'+metaJson+'<\/script>'
    +'<script id="app-script">'+app+'<\/script>'
    +'</body></html>';
}
function downloadHTML(){
  try{localStorage.setItem(LSKEY,JSON.stringify({t:Date.now(),s:STATE,g:EXTRA_GROUPS,m:META}));}catch(e){}
  const blob=new Blob([buildDoc()],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='Villa_606_Interactive_Document_Dashboard.html';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1200);setSave('Downloaded with latest changes',false);
}

const SHARED_API='https://script.google.com/macros/s/AKfycbx-vivjo4hnxRe63mCpSVBQUy1DD8dTKhSkhtOiJKyU9IzEaMsikuJNdov1Tr1BPWY/exec';
let pubTimer=null, pending=false, publishing=false;
let sharedSaveTimer=null, sharedSavePending=false, DIRTY_FIELD=null, DIRTY_ID=null;
function persist(id,field){
  try{ localStorage.setItem(LSKEY, JSON.stringify({t:Date.now(), s:STATE, g:EXTRA_GROUPS, m:META})); }catch(e){}
  if(id!=null&&field){ DIRTY_ID=id; DIRTY_FIELD=field; }
  setSave('Autosaving…',true);
  sharedSavePending=true;
  clearTimeout(sharedSaveTimer);
  sharedSaveTimer=setTimeout(()=>saveShared(),500);
}
async function saveShared(){
  if(publishing){ sharedSavePending=true; return; }
  const id=DIRTY_ID, field=DIRTY_FIELD;
  if(id==null||!field){ setSave('Shared tracker · latest data loaded',false); return; }
  const item=STATE.find(x=>String(x.id)===String(id));
  if(!item)return;
  const expected=String(item[field]??'');
  publishing=true; sharedSavePending=false;
  setSave('Autosaving…',true);
  try{
    // Google Apps Script may redirect cross-origin GET responses to an HTML interstitial.
    // Send the update as a navigation-safe request, then verify it with the normal data GET.
    const updateUrl=SHARED_API+'?action=update&id='+encodeURIComponent(id)+'&field='+encodeURIComponent(field)+'&value='+encodeURIComponent(expected)+'&_='+Date.now();
    await fetch(updateUrl,{mode:'no-cors',cache:'no-store'});
    await new Promise(r=>setTimeout(r,650));
    const verifyRes=await fetch(SHARED_API+'?_='+Date.now(),{cache:'no-store'});
    const verify=await verifyRes.json();
    if(!verify.success||!Array.isArray(verify.data))throw new Error('Could not verify shared data');
    const saved=verify.data.find(r=>String(r.id)===String(id));
    if(!saved||String(saved[field]??'')!==expected)throw new Error('Google Sheet did not confirm the change');
    try{localStorage.removeItem(LSKEY)}catch(e){}
    setSave('Shared tracker autosaved ✓',false);
  }catch(e){
    setSave('Autosave failed · '+(e.message||'please retry'),true);
  }finally{
    publishing=false;
    if(sharedSavePending){ clearTimeout(sharedSaveTimer); sharedSaveTimer=setTimeout(()=>saveShared(),500); }
  }
}
async function loadShared(){
  setSave('Loading shared tracker…',true);
  try{
    const res=await fetch(SHARED_API+'?_='+Date.now(),{cache:'no-store'});
    const out=await res.json();
    if(!out.success||!Array.isArray(out.data))throw new Error(out.error||'Load failed');
    STATE=out.data.map((r,i)=>({id:r.id||i+1,main:r.main||'',group:r.group||'',title:r.title||'',status:r.status||'Not Started',resp:r.resp||'',date:r.date||'',rem:r.rem||'',link:r.link||''}));
    render(); setSave('Shared tracker · latest data loaded',false);
  }catch(e){
    overlayLocal(); render(); setSave('Offline copy · shared data unavailable',true);
  }
}

function exportCSV(){
  const head=["No","Main Folder","Section","Document","Status","Responsible","Status Date","Remarks","Document Link"];
  const q=c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"';
  const lines=[head.map(q).join(',')];
  STATE.forEach(r=>lines.push([r.id,r.main,r.group,r.title,r.status,r.resp,r.date,r.rem,r.link||""].map(q).join(',')));
  const data=lines.join('\r\n');
  (async()=>{
    const dl = (window.claude&&claude.use)? await claude.use('downloads') : null;
    if(dl){ try{ await dl.save({filename:'Villa606_Document_Tracker.csv', data}); return; }catch(e){} }
    // fallback (works in normal browser tab; may be blocked in sandbox)
    try{ const b=new Blob([data],{type:'text/csv'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download='Villa606_Document_Tracker.csv'; a.click(); URL.revokeObjectURL(u);}catch(e){ alert('Export not available in this view.'); }
  })();
}

// boot
function overlayLocal(){
  try{
    const ls=JSON.parse(localStorage.getItem(LSKEY));
    if(ls&&Array.isArray(ls.s)){
      STATE=ls.s.map((r,i)=>({id:r.id||i+1,main:r.main||'',group:r.group||'',title:r.title||'',status:r.status||'Not Started',resp:r.resp||'',date:r.date||'',rem:r.rem||'',link:r.link||''}));
      EXTRA_GROUPS=ls.g||EXTRA_GROUPS;
      if(ls.m)META={...META,...ls.m};
    }
  }catch(e){}
}
render();
(async()=>{
  capReady=true;
  await loadShared();
})();
